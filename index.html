<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TimeFlow • Attendance</title>

  <!-- Apple-Style "CL" SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230071e3'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,SF Pro Display,sans-serif' font-weight='700' font-size='28' fill='%23ffffff' letter-spacing='-1'%3ECL%3C/text%3E%3C/svg%3E">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #1d1d1f;
      --subtext: #86868b;
      --accent: #0071e3;
      --border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      --danger: #ff3b30;
      --success: #34c759;
      --warning: #ff9500;
      --input-bg: rgba(120, 120, 128, 0.08);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --text: #f5f5f7;
      --subtext: #a1a1a6;
      --accent: #2997ff;
      --border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      --input-bg: rgba(120, 120, 128, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background-color 0.3s ease;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--card-shadow);
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-icon {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      letter-spacing: -0.5px;
    }
    .brand { font-weight: 600; font-size: 14px; letter-spacing: -0.2px; }
    
    .theme-toggle {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
    p.desc { font-size: 14px; color: var(--subtext); margin-top: 4px; }

    .input-group { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--input-bg); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:active { transform: scale(0.98); }

    .status-msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      display: none;
      word-break: break-word;
    }
    .msg-err { background: rgba(255, 59, 48, 0.15); color: var(--danger); display: block; }
    .msg-ok { background: rgba(52, 199, 89, 0.15); color: var(--success); display: block; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
    }
    .badge-ok { background: rgba(52, 199, 89, 0.15); color: var(--success); }
    .badge-error { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
    .badge-warn { background: rgba(255, 149, 0, 0.15); color: var(--warning); }

    .shift-timer {
      margin: 16px 0;
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .table-container { margin-top: 20px; max-height: 220px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { color: var(--subtext); padding-bottom: 8px; border-bottom: 1px solid var(--border); font-weight: 500; }
    td { padding: 10px 0; border-bottom: 1px solid var(--border); }

    .tag-9h {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-pass { background: rgba(52, 199, 89, 0.15); color: var(--success); }
    .tag-fail { background: rgba(255, 149, 0, 0.15); color: var(--warning); }

    .hidden { display: none !important; }
  </style>
</head>
<body data-theme="light">

<div class="glass-card">
  <div class="top-bar">
    <div class="brand-group">
      <span class="badge-icon">CL</span>
      <span class="brand">TimeFlow</span>
    </div>
    <button class="theme-toggle" id="themeBtn" type="button">🌙</button>
  </div>

  <!-- 1. LOGIN / FIRST-TIME REGISTER VIEW -->
  <div id="authSection">
    <h1>Sign In</h1>
    <p class="desc">Default setup password is: <b>test123</b></p>
    <div id="authNotice" class="status-msg"></div>

    <div class="input-group">
      <input type="email" id="email" placeholder="name@company.com" autocomplete="email">
      <input type="password" id="password" placeholder="Password (default: test123)" autocomplete="current-password">
      <button class="btn btn-primary" id="btnLogin" type="button">Sign In</button>
      <button class="btn btn-secondary" id="btnRegister" type="button">First Time Setup</button>
    </div>
  </div>

  <!-- 2. MANDATORY PASSWORD CHANGE VIEW -->
  <div id="pwdChangeSection" class="hidden">
    <h1>Update Password</h1>
    <p class="desc">You must change your default password to continue.</p>
    <div id="pwdNotice" class="status-msg"></div>

    <div class="input-group">
      <input type="password" id="newPassword" placeholder="Enter new secure password">
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
      <button class="btn btn-primary" id="btnUpdatePwd" type="button">Save New Password</button>
    </div>
  </div>

  <!-- 3. ATTENDANCE DASHBOARD -->
  <div id="dashSection" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h1 id="userGreeting">Hi there</h1>
        <p class="desc" id="geoAccuracy">Locating position...</p>
      </div>
      <button class="btn-secondary" id="btnLogout" type="button" style="padding: 6px 12px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer;">Log Out</button>
    </div>

    <div style="margin: 24px 0; text-align: center;">
      <div id="locBadge" class="status-badge badge-warn">Verifying Geofence...</div>
      <div id="timerDisplay" class="shift-timer">00:00:00</div>
      
      <div style="display: flex; gap: 10px;">
        <button id="btnCheckIn" class="btn btn-primary" type="button" disabled>Check In</button>
        <button id="btnCheckOut" class="btn btn-danger" type="button" disabled>Check Out</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <p class="desc" style="font-weight: 600;">Shift History</p>
      <span style="font-size: 11px; color: var(--subtext);">Standard: 9h/day</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>In</th>
            <th>Out</th>
            <th>Hours</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 1. THEME TOGGLE
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeBtn.innerText = isDark ? '🌙' : '☀️';
  });

  // 2. SUPABASE INITIALIZATION
  const SUPABASE_URL = "https://ssxbdhcbhhzqkqrajzin.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzeGJkaGNiaGh6cWtxcmFqemluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzUwNzUsImV4cCI6MjEwNDAxMTA3NX0.i0LDT9keH2Wf49MSlvXNtHsJhBKgOY3u9r9FllfiLMo";
  const clientDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 3. GEOFENCE CONFIG (6.9072, 79.8498)
  const OFFICE_LAT = 6.907203859406421;
  const OFFICE_LNG = 79.84985425058369;
  const MAX_RADIUS_METERS = 200;
  const DEFAULT_PWD = "test123";

  let currentUser = null;
  let activeShift = null;
  let timerInterval = null;
  let isWithinBounds = false;

  function showMessage(targetId, text, isError = true) {
    const box = document.getElementById(targetId);
    if (!box) return;
    box.innerText = text;
    box.className = isError ? "status-msg msg-err" : "status-msg msg-ok";
  }

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function startLocationWatcher() {
    if (!navigator.geolocation) {
      document.getElementById('geoAccuracy').innerText = "GPS not supported on device";
      return;
    }

    navigator.geolocation.watchPosition(
      (pos) => {
        const coords = pos.coords;
        const dist = calculateDistance(coords.latitude, coords.longitude, OFFICE_LAT, OFFICE_LNG);
        const badge = document.getElementById('locBadge');
        isWithinBounds = dist <= MAX_RADIUS_METERS;

        document.getElementById('geoAccuracy').innerText = `GPS Accuracy: ±${Math.round(coords.accuracy)}m`;

        if (isWithinBounds) {
          badge.className = "status-badge badge-ok";
          badge.innerText = `● Inside Office (${Math.round(dist)}m)`;
        } else {
          badge.className = "status-badge badge-error";
          badge.innerText = `✕ Outside Bounds (${Math.round(dist)}m away)`;
        }
        updateButtonStates();
      },
      (err) => {
        const badge = document.getElementById('locBadge');
        badge.className = "status-badge badge-error";
        badge.innerText = "Location permission blocked";
        document.getElementById('geoAccuracy').innerText = "Allow location in browser";
      },
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
    );
  }

  function updateButtonStates() {
    const btnIn = document.getElementById('btnCheckIn');
    const btnOut = document.getElementById('btnCheckOut');

    if (activeShift) {
      btnIn.disabled = true;
      btnOut.disabled = !isWithinBounds;
    } else {
      btnIn.disabled = !isWithinBounds;
      btnOut.disabled = true;
    }
  }

  function updateLiveClock() {
    if (!activeShift) return;
    const diff = Math.floor((new Date() - new Date(activeShift.check_in)) / 1000);
    const hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
    const mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
    const secs = String(diff % 60).padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
  }

  // 4. AUTHENTICATION & FIRST-TIME SETUP
  async function handleRegister() {
    const email = document.getElementById('email').value.trim();
    if (!email) return showMessage('authNotice', "Enter your work email.");

    showMessage('authNotice', "Provisioning account...", false);

    // Initial sign-up always assigns the default password
    const { data, error } = await clientDB.auth.signUp({
      email: email,
      password: DEFAULT_PWD
    });

    if (error) {
      showMessage('authNotice', error.message, true);
    } else {
      showMessage('authNotice', "Account created! Signing in...", false);
      const { error: loginErr } = await clientDB.auth.signInWithPassword({
        email: email,
        password: DEFAULT_PWD
      });
      if (loginErr) showMessage('authNotice', loginErr.message, true);
      else checkSession();
    }
  }

  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) return showMessage('authNotice', "Please fill in email and password.");

    showMessage('authNotice', "Signing in...", false);
    const { error } = await clientDB.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage('authNotice', error.message, true);
    } else {
      checkSession();
    }
  }

  // 5. MANDATORY PASSWORD UPDATE
  async function handlePasswordUpdate() {
    const newPwd = document.getElementById('newPassword').value;
    const confirmPwd = document.getElementById('confirmPassword').value;

    if (!newPwd || newPwd.length < 6) {
      return showMessage('pwdNotice', "Password must be at least 6 characters.");
    }
    if (newPwd === DEFAULT_PWD) {
      return showMessage('pwdNotice', "New password cannot be the default test123.");
    }
    if (newPwd !== confirmPwd) {
      return showMessage('pwdNotice', "Passwords do not match.");
    }

    showMessage('pwdNotice', "Saving password...", false);

    // Update password in Supabase Auth
    const { error: authErr } = await clientDB.auth.updateUser({ password: newPwd });
    if (authErr) return showMessage('pwdNotice', authErr.message, true);

    // Mark password as changed in profile table
    await clientDB.from('profiles').upsert({
      id: currentUser.id,
      email: currentUser.email,
      must_change_password: false
    });

    alert("Password updated successfully! Welcome to TimeFlow.");
    checkSession();
  }

  async function signOut() {
    clearInterval(timerInterval);
    await clientDB.auth.signOut();
    checkSession();
  }

  // 6. ATTENDANCE CLOCK IN / OUT
  async function punchTime(action) {
    if (!isWithinBounds) return alert("You must be within 200m of the office location.");

    if (action === 'in') {
      const { data, error } = await clientDB.from('attendance').insert([{
        user_id: currentUser.id,
        user_email: currentUser.email,
        check_in: new Date().toISOString()
      }]).select().single();

      if (!error) {
        activeShift = data;
        clearInterval(timerInterval);
        timerInterval = setInterval(updateLiveClock, 1000);
        updateButtonStates();
        loadHistory();
      } else {
        alert("Check-in error: " + error.message);
      }
    } else {
      const now = new Date();
      const checkInTime = new Date(activeShift.check_in);
      const hoursWorked = parseFloat(((now - checkInTime) / 36e5).toFixed(2));

      const { error } = await clientDB.from('attendance').update({
        check_out: now.toISOString(),
        work_hours: hoursWorked
      }).eq('id', activeShift.id);

      if (!error) {
        activeShift = null;
        clearInterval(timerInterval);
        document.getElementById('timerDisplay').innerText = "00:00:00";
        updateButtonStates();
        loadHistory();
      } else {
        alert("Check-out error: " + error.message);
      }
    }
  }

  async function loadHistory() {
    const { data } = await clientDB.from('attendance')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('check_in', { ascending: false });

    const tbody = document.getElementById('recordsBody');
    tbody.innerHTML = '';

    data?.forEach(row => {
      const inDate = new Date(row.check_in);
      const outDate = row.check_out ? new Date(row.check_out) : null;
      const isComplete9h = row.work_hours >= 9;

      tbody.innerHTML += `
        <tr>
          <td>${inDate.toLocaleDateString([], { month: 'short', day: 'numeric' })}</td>
          <td>${inDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
          <td>${outDate ? outDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--'}</td>
          <td>
            ${row.work_hours 
              ? `<span class="tag-9h ${isComplete9h ? 'tag-pass' : 'tag-fail'}">${row.work_hours}h</span>` 
              : '<span style="color:var(--accent)">Active</span>'}
          </td>
        </tr>`;
    });
  }

  async function checkSession() {
    const { data: { session } } = await clientDB.auth.getSession();
    
    if (session) {
      currentUser = session.user;

      // Check if user still needs to update their initial password
      const { data: profile } = await clientDB
        .from('profiles')
        .select('must_change_password')
        .eq('id', currentUser.id)
        .maybeSingle();

      const mustChange = profile ? profile.must_change_password : false;

      if (mustChange) {
        // Enforce mandatory password change screen
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashSection').classList.add('hidden');
        document.getElementById('pwdChangeSection').classList.remove('hidden');
        return;
      }

      // Show Main Punch Dashboard
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('pwdChangeSection').classList.add('hidden');
      document.getElementById('dashSection').classList.remove('hidden');
      document.getElementById('userGreeting').innerText = `Hi, ${currentUser.email.split('@')[0]}`;

      // Look up any active shift
      const { data: openShift } = await clientDB
        .from('attendance')
        .select('*')
        .eq('user_id', currentUser.id)
        .is('check_out', null)
        .order('check_in', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (openShift) {
        activeShift = openShift;
        clearInterval(timerInterval);
        timerInterval = setInterval(updateLiveClock, 1000);
      }

      startLocationWatcher();
      loadHistory();
    } else {
      currentUser = null;
      activeShift = null;
      clearInterval(timerInterval);
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('pwdChangeSection').classList.add('hidden');
      document.getElementById('dashSection').classList.add('hidden');
    }
  }

  // 7. EVENT LISTENERS
  document.getElementById('btnLogin').addEventListener('click', handleLogin);
  document.getElementById('btnRegister').addEventListener('click', handleRegister);
  document.getElementById('btnUpdatePwd').addEventListener('click', handlePasswordUpdate);
  document.getElementById('btnLogout').addEventListener('click', signOut);
  document.getElementById('btnCheckIn').addEventListener('click', () => punchTime('in'));
  document.getElementById('btnCheckOut').addEventListener('click', () => punchTime('out'));

  checkSession();
</script>
</body>
</html>
