<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TimeFlow • Attendance</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #1d1d1f;
      --subtext: #86868b;
      --accent: #0071e3;
      --border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      --danger: #ff3b30;
      --success: #34c759;
      --warning: #ff9500;
      --input-bg: rgba(120, 120, 128, 0.08);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --text: #f5f5f7;
      --subtext: #a1a1a6;
      --accent: #2997ff;
      --border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      --input-bg: rgba(120, 120, 128, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background-color 0.3s ease;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--card-shadow);
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--subtext);
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text);
    }

    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
    p.desc { font-size: 14px; color: var(--subtext); margin-top: 4px; }

    .input-group { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--input-bg); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:active { transform: scale(0.98); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
    }
    .badge-ok { background: rgba(52, 199, 89, 0.15); color: var(--success); }
    .badge-error { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
    .badge-warn { background: rgba(255, 149, 0, 0.15); color: var(--warning); }

    .shift-timer {
      margin: 16px 0;
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .table-container {
      margin-top: 20px;
      max-height: 220px;
      overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { color: var(--subtext); padding-bottom: 8px; border-bottom: 1px solid var(--border); font-weight: 500; }
    td { padding: 10px 0; border-bottom: 1px solid var(--border); }

    .tag-9h {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-pass { background: rgba(52, 199, 89, 0.15); color: var(--success); }
    .tag-fail { background: rgba(255, 149, 0, 0.15); color: var(--warning); }

    .hidden { display: none !important; }
  </style>
</head>
<body data-theme="light">

<div class="glass-card">
  <div class="top-bar">
    <span class="brand"> TimeFlow</span>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Switch theme">🌙</button>
  </div>

  <!-- AUTH FORM -->
  <div id="authSection">
    <h1>Welcome</h1>
    <p class="desc">Sign in with your work email</p>
    <div class="input-group">
      <input type="email" id="email" placeholder="name@company.com" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-primary" onclick="handleAuth('login')">Sign In</button>
      <button class="btn btn-secondary" onclick="handleAuth('signup')">Register</button>
    </div>
  </div>

  <!-- ATTENDANCE DASHBOARD -->
  <div id="dashSection" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h1 id="userGreeting">Hi there</h1>
        <p class="desc" id="geoAccuracy">Finding location...</p>
      </div>
      <button class="btn-secondary" style="padding: 6px 12px; border-radius: 10px; font-size: 12px; border: none; cursor: pointer;" onclick="signOut()">Log Out</button>
    </div>

    <div style="margin: 24px 0; text-align: center;">
      <div id="locBadge" class="status-badge badge-warn">Checking Geofence...</div>
      <div id="timerDisplay" class="shift-timer">00:00:00</div>
      
      <div style="display: flex; gap: 10px;">
        <button id="btnCheckIn" class="btn btn-primary" onclick="punchTime('in')" disabled>Check In</button>
        <button id="btnCheckOut" class="btn btn-danger" onclick="punchTime('out')" disabled>Check Out</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <p class="desc" style="font-weight: 600;">Shift History</p>
      <span style="font-size: 11px; color: var(--subtext);">Target: 9h/day</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>In</th>
            <th>Out</th>
            <th>Hours</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 1. SUPABASE CONFIGURATION
  const SUPABASE_URL = "https://ssxbdhcbhhzqkqrajzin.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzeGJkaGNiaGh6cWtxcmFqemluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzUwNzUsImV4cCI6MjEwNDAxMTA3NX0.i0LDT9keH2Wf49MSlvXNtHsJhBKgOY3u9r9FllfiLMo";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 2. GEOFENCE CONFIGURATION
  const OFFICE_LAT = 6.907203859406421;
  const OFFICE_LNG = 79.84985425058369;
  const MAX_RADIUS_METERS = 200; // Geofence boundary radius

  let currentUser = null;
  let activeShift = null;
  let timerInterval = null;
  let isWithinBounds = false;

  // Haversine formula: Computes straight-line distance on earth surface
  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function startLocationWatcher() {
    if (!navigator.geolocation) {
      document.getElementById('geoAccuracy').innerText = "Geolocation not supported";
      return;
    }

    navigator.geolocation.watchPosition(
      (pos) => {
        const coords = pos.coords;
        const dist = calculateDistance(coords.latitude, coords.longitude, OFFICE_LAT, OFFICE_LNG);
        const badge = document.getElementById('locBadge');
        isWithinBounds = dist <= MAX_RADIUS_METERS;

        document.getElementById('geoAccuracy').innerText = `GPS Accuracy: ±${Math.round(coords.accuracy)}m`;

        if (isWithinBounds) {
          badge.className = "status-badge badge-ok";
          badge.innerText = `● Inside Office (${Math.round(dist)}m)`;
        } else {
          badge.className = "status-badge badge-error";
          badge.innerText = `✕ Outside Bounds (${Math.round(dist)}m away)`;
        }

        updateButtonStates();
      },
      (err) => {
        const badge = document.getElementById('locBadge');
        badge.className = "status-badge badge-error";
        badge.innerText = "Location access blocked";
        document.getElementById('geoAccuracy').innerText = "Enable GPS in settings";
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  }

  function updateButtonStates() {
    const btnIn = document.getElementById('btnCheckIn');
    const btnOut = document.getElementById('btnCheckOut');

    if (activeShift) {
      btnIn.disabled = true;
      btnOut.disabled = !isWithinBounds; // Must be on-site to check out
    } else {
      btnIn.disabled = !isWithinBounds;  // Must be on-site to check in
      btnOut.disabled = true;
    }
  }

  function updateLiveClock() {
    if (!activeShift) {
      document.getElementById('timerDisplay').innerText = "00:00:00";
      return;
    }
    const diff = Math.floor((new Date() - new Date(activeShift.check_in)) / 1000);
    const hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
    const mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
    const secs = String(diff % 60).padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
  }

  async function handleAuth(type) {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return alert("Please enter both email and password.");

    const { error } = type === 'signup' 
      ? await supabase.auth.signUp({ email, password })
      : await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      alert(error.message);
    } else {
      checkSession();
    }
  }

  async function signOut() {
    clearInterval(timerInterval);
    await supabase.auth.signOut();
    checkSession();
  }

  async function punchTime(action) {
    if (!isWithinBounds) {
      alert("You must be on-site within the 200m office radius.");
      return;
    }

    if (action === 'in') {
      const { data, error } = await supabase.from('attendance').insert([{
        user_id: currentUser.id,
        user_email: currentUser.email,
        check_in: new Date().toISOString()
      }]).select().single();

      if (!error) {
        activeShift = data;
        clearInterval(timerInterval);
        timerInterval = setInterval(updateLiveClock, 1000);
        updateButtonStates();
        loadHistory();
      } else {
        alert(error.message);
      }
    } else {
      const now = new Date();
      const checkInTime = new Date(activeShift.check_in);
      const hoursWorked = parseFloat(((now - checkInTime) / 36e5).toFixed(2));

      const { error } = await supabase.from('attendance').update({
        check_out: now.toISOString(),
        work_hours: hoursWorked
      }).eq('id', activeShift.id);

      if (!error) {
        activeShift = null;
        clearInterval(timerInterval);
        document.getElementById('timerDisplay').innerText = "00:00:00";
        updateButtonStates();
        loadHistory();
      } else {
        alert(error.message);
      }
    }
  }

  async function loadHistory() {
    const { data } = await supabase.from('attendance')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('check_in', { ascending: false });

    const tbody = document.getElementById('recordsBody');
    tbody.innerHTML = '';

    data?.forEach(row => {
      const inDate = new Date(row.check_in);
      const outDate = row.check_out ? new Date(row.check_out) : null;
      const isComplete9h = row.work_hours >= 9;

      tbody.innerHTML += `
        <tr>
          <td>${inDate.toLocaleDateString([], { month: 'short', day: 'numeric' })}</td>
          <td>${inDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
          <td>${outDate ? outDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--'}</td>
          <td>
            ${row.work_hours 
              ? `<span class="tag-9h ${isComplete9h ? 'tag-pass' : 'tag-fail'}">${row.work_hours}h</span>` 
              : '<span style="color:var(--accent)">Active</span>'}
          </td>
        </tr>`;
    });
  }

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('dashSection').classList.remove('hidden');
      document.getElementById('userGreeting').innerText = `Hi, ${currentUser.email.split('@')[0]}`;

      // Check if user has an active, unclosed shift in the DB
      const { data: openShift } = await supabase
        .from('attendance')
        .select('*')
        .eq('user_id', currentUser.id)
        .is('check_out', null)
        .order('check_in', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (openShift) {
        activeShift = openShift;
        clearInterval(timerInterval);
        timerInterval = setInterval(updateLiveClock, 1000);
      }

      startLocationWatcher();
      loadHistory();
    } else {
      currentUser = null;
      activeShift = null;
      clearInterval(timerInterval);
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('dashSection').classList.add('hidden');
    }
  }

  function toggleTheme() {
    const body = document.body;
    const isDark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isDark ? '🌙' : '☀️';
  }

  // Restore preferred theme on start
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    toggleTheme();
  }

  checkSession();
</script>
</body>
</html>
